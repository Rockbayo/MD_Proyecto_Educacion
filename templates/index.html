<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ materia }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #2c3e50; font-size: 1.5rem; margin-top: 0; }
        h2 { color: #34495e; font-size: 1.2rem; margin-bottom: 1.5rem; }
        ul { list-style-type: none; padding: 0; }
        li { background: #eef2f7; margin: 0.5rem 0; padding: 0.75rem; border-radius: 4px; color: #333; }
        .tag { font-weight: bold; color: #2980b9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Materia: {{ materia }}</h1>
        <h2><span class="tag">Tema:</span> {{ tema }}</h2>
        
        <h3>Integrantes:</h3>
        <ul>
            {% for integrante in integrantes %}
                <li>{{ integrante }}</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
