{% extends "base.html" %}

{% block content %}
<div class="card border-0 animate-slide-up">
    <div class="card-header">
        <div class="d-flex align-items-center justify-content-between">
            <h3 class="mb-0 d-flex align-items-center gap-2">
                <i class="bi bi-table"></i>
                5. Dataset
            </h3>
            <span class="badge bg-light text-primary fw-semibold">Fase 1</span>
        </div>
    </div>
    <div class="card-body p-4 p-md-5">
        <div class="alert alert-info d-flex align-items-start gap-3 mb-4">
            <i class="bi bi-info-circle-fill fs-4 text-primary mt-1"></i>
            <div>
                <h5 class="fw-bold alert-heading mb-1">Estructura del Dataset</h5>
                <p class="mb-0">Descripción del conjunto de datos consolidado, variables seleccionadas y transformaciones preliminares.</p>
            </div>
        </div>
        <p class="text-muted mb-0">Contenido en preparación para el entregable.</p>
    </div>
</div>
{% endblock %}
