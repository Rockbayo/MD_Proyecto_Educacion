<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMetricsCO — Educación y Desempeño Académico</title>
    
    <link rel="icon" href="{{ url_for('static', filename='assets/images/favicon.ico') }}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#0D1117',
                        foreground: '#E2E8F0',
                        primary: { DEFAULT: '#00B4D8', foreground: '#0D1117' },
                        secondary: { DEFAULT: '#0F1D2E', foreground: '#CBD5E1' },
                        accent: { DEFAULT: '#48CAE4', foreground: '#0D1117' },
                        muted: { DEFAULT: '#1A2535', foreground: '#64748B' },
                        card: { DEFAULT: '#111827', foreground: '#E2E8F0' },
                        border: '#1E293B',
                    },
                    fontFamily: {
                        sans: ['"DM Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-[#0D1117] min-h-screen flex flex-col relative overflow-x-hidden m-0 p-0 text-foreground font-sans">
    
    <!-- Header -->
    <header id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-transparent border-b border-transparent">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between relative z-10">
            <!-- Retorno al Index -->
            <a href="{{ url_for('index') }}" class="flex items-center gap-2.5 group">
                <img src="{{ url_for('static', filename='assets/images/app_logo.png') }}" alt="EduDataCO Logo" class="w-8 h-8 object-contain">
                <span class="font-mono text-sm font-semibold tracking-tight text-foreground group-hover:text-primary transition-colors hidden sm:block">EduMetricsCO</span>
            </a>
            
            <!-- Bloque Derecho -->
            <div class="hidden md:flex items-center gap-3 ml-auto">
                <span class="phase-badge">Semestre 2026-II</span>
                <a href="https://github.com/Rockbayo/MD_Proyecto_Educacion" target="_blank" class="btn-ghost text-xs py-1.5 px-3 h-8 font-mono">GitHub</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full relative z-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-border bg-background py-8 text-center text-xs text-muted-foreground font-mono relative z-10">
        <p>© 2026 Universidad de Cundinamarca · Ing. Sistemas y Computación</p>
    </footer>

    <script>
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 40) {
                nav.classList.add('bg-background/90', 'backdrop-blur-xl', 'border-border', 'shadow-lg');
                nav.classList.remove('bg-transparent', 'border-transparent');
            } else {
                nav.classList.remove('bg-background/90', 'backdrop-blur-xl', 'border-border', 'shadow-lg');
                nav.classList.add('bg-transparent', 'border-transparent');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { rootMargin: '0px', threshold: 0.1 });

            document.querySelectorAll('.animate-on-scroll').forEach((el) => {
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
