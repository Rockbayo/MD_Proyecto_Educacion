<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMetricsCO — Educación y Desempeño Académico</title>
    
    <link rel="icon" href="{{ url_for('static', filename='assets/images/favicon.ico') }}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tema inicial -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('edumetrics_theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
            }
        })();
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: 'var(--background)',
                        foreground: 'var(--foreground)',
                        primary: { DEFAULT: 'var(--primary)', foreground: 'var(--primary-foreground)' },
                        secondary: { DEFAULT: 'var(--secondary)', foreground: 'var(--secondary-foreground)' },
                        accent: { DEFAULT: 'var(--accent)', foreground: 'var(--accent-foreground)' },
                        muted: { DEFAULT: 'var(--muted)', foreground: 'var(--muted-foreground)' },
                        card: { DEFAULT: 'var(--card)', foreground: 'var(--card-foreground)' },
                        border: 'var(--border)',
                    },
                    fontFamily: {
                        sans: ['"DM Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-background min-h-screen flex flex-col relative overflow-x-hidden m-0 p-0 text-foreground font-sans">
    
    <!-- Barra de scroll -->
    <div id="scrollProgress" class="fixed top-0 left-0 h-1 bg-gradient-to-r from-primary via-accent to-primary z-[60] transition-all duration-75 w-0"></div>

    <!-- Header -->
    <header id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-transparent border-b border-transparent">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between relative z-10">
            <!-- Retorno al Index -->
            <a href="{{ url_for('index') }}" class="flex items-center gap-2.5 group">
                <img src="{{ url_for('static', filename='assets/images/app_logo.png') }}" alt="EduDataCO Logo" class="w-8 h-8 object-contain">
                <span class="font-mono text-sm font-semibold tracking-tight text-foreground group-hover:text-primary transition-colors hidden sm:block">EduMetricsCO</span>
            </a>
            
            <!-- Acciones nav -->
            <div class="flex items-center gap-2.5 ml-auto">
                <span class="phase-badge hidden sm:inline-block">Semestre 2026-II</span>
                
                <!-- Toggle tema -->
                <button id="themeToggle" type="button" class="btn-ghost text-xs py-1.5 px-3 h-8 font-mono flex items-center gap-1.5" title="Alternar tema">
                    <span id="themeIcon">🌙</span>
                    <span id="themeText" class="hidden sm:inline">Oscuro</span>
                </button>
                
                <a href="https://github.com/Rockbayo/MD_Proyecto_Educacion" target="_blank" class="btn-ghost text-xs py-1.5 px-3 h-8 font-mono">GitHub</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full relative z-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-border bg-background py-8 text-center text-xs text-muted-foreground font-mono relative z-10">
        <p>© 2026 Universidad de Cundinamarca · Ing. Sistemas y Computación</p>
    </footer>

    <script>
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 40) {
                nav.classList.add('bg-background/90', 'backdrop-blur-xl', 'border-border', 'shadow-lg');
                nav.classList.remove('bg-transparent', 'border-transparent');
            } else {
                nav.classList.remove('bg-background/90', 'backdrop-blur-xl', 'border-border', 'shadow-lg');
                nav.classList.add('bg-transparent', 'border-transparent');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { rootMargin: '0px', threshold: 0.1 });

            document.querySelectorAll('.animate-on-scroll').forEach((el) => {
                observer.observe(el);
            });
        });

        // Modo claro / oscuro
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');

        function syncThemeUI(theme) {
            if (theme === 'light') {
                themeIcon.textContent = '☀️';
                if (themeText) themeText.textContent = 'Claro';
            } else {
                themeIcon.textContent = '🌙';
                if (themeText) themeText.textContent = 'Oscuro';
            }
        }

        const currentTheme = localStorage.getItem('edumetrics_theme') || 'dark';
        syncThemeUI(currentTheme);

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark');
                if (isDark) {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light');
                    localStorage.setItem('edumetrics_theme', 'light');
                    syncThemeUI('light');
                } else {
                    document.documentElement.classList.remove('light');
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('edumetrics_theme', 'dark');
                    syncThemeUI('dark');
                }
            });
        }

        // Progreso de lectura
        window.addEventListener('scroll', () => {
            const progressBar = document.getElementById('scrollProgress');
            if (progressBar) {
                const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                progressBar.style.width = scrolled + '%';
            }
        });
    </script>
</body>
</html>
